<!doctype html>

    <meta name="theme-color" content="#f5f5f7" />
    <!-- Apply the saved theme/language before first paint (defaults: light, English). -->
    <script>
      var d = document.documentElement;
      var theme = "light";
      try {
        if (localStorage.getItem("theme") === "dark") theme = "dark";
        if (localStorage.getItem("lang") === "id") d.lang = "id";
      } catch (e) {}
      d.dataset.theme = theme;
      d.style.colorScheme = theme;
      if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#161617");
    </script>
